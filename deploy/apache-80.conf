# Copiar para /etc/httpd/conf.d/sentinela-painel-80.conf
# Passo 1: atende só a porta 80 (para o Let's Encrypt validar o domínio) e manda o resto para HTTPS.
<VirtualHost *:80>
    ServerName painel.sentinelaunivag.com.br
    DocumentRoot /var/www/html

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>
