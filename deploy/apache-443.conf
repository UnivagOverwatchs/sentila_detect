# Copiar para /etc/httpd/conf.d/zz-sentinela-painel-443.conf  (o "zz" faz carregar depois do ssl.conf padrão)
# Passo 2: só depois de emitir o certificado (senão o Apache não sobe).
<VirtualHost *:443>
    ServerName painel.sentinelaunivag.com.br

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/painel.sentinelaunivag.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/painel.sentinelaunivag.com.br/privkey.pem

    # O app escuta só em 127.0.0.1:8090; o Apache entrega o HTTPS e repassa.
    ProxyPreserveHost On
    ProxyTimeout 3600

    # Tamanho máximo de um pedido: a foto do alerta (até 2 MB em base64 ≈ 2,8 MB) cabe com folga.
    # Recusado aqui, um pedido gigante nem chega ao app (que leria tudo para a memória).
    LimitRequestBody 4194304

    # Tempo real (WebSocket) antes da regra geral.
    ProxyPass        /api/ws ws://127.0.0.1:8090/api/ws
    ProxyPassReverse /api/ws ws://127.0.0.1:8090/api/ws

    ProxyPass        / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/

    # Navegador: só HTTPS, sem adivinhar tipo de arquivo, sem abrir em moldura de outro site.
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=()"

    # Política de conteúdo: só scripts/estilos do próprio site; 'wasm-unsafe-eval' é exigido pelo MediaPipe (WASM)
    # da câmera do navegador. Começa em modo "Report-Only" (só avisa no console do navegador, não bloqueia):
    # depois de usar o painel e a câmera do navegador sem avisos, troque para "Content-Security-Policy".
    Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
</VirtualHost>
