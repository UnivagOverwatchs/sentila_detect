# Copiar para /etc/httpd/conf.d/zz-sentinela-painel-443.conf  (o "zz" faz carregar depois do ssl.conf padrão)
# Passo 2: só depois de emitir o certificado (senão o Apache não sobe).
<VirtualHost *:443>
    ServerName painel.sentinelaunivag.com.br

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/painel.sentinelaunivag.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/painel.sentinelaunivag.com.br/privkey.pem

    # O app escuta só em 127.0.0.1:8090; o Apache entrega o HTTPS e repassa.
    ProxyPreserveHost On
    ProxyTimeout 3600

    # Tempo real (WebSocket) antes da regra geral.
    ProxyPass        /api/ws ws://127.0.0.1:8090/api/ws
    ProxyPassReverse /api/ws ws://127.0.0.1:8090/api/ws

    ProxyPass        / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/

    # Navegador: só HTTPS, sem adivinhar tipo de arquivo, sem abrir em moldura de outro site.
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
</VirtualHost>
